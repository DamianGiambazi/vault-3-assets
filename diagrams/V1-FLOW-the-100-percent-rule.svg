<rect x="40" y="582" width="1130" height="186" rx="16" fill="#EEF2F7" stroke="#8A94A6" stroke-width="1.5" stroke-dasharray="9 7"/>
<text x="1152" y="606" text-anchor="end" font-size="14" font-weight="600" letter-spacing="1" fill="#5B6472">capstone_rag.py · Vault 1&#x27;s smoke-lab venv</text>
<rect x="60" y="620" width="310" height="130" rx="12" fill="#E3ECFA" stroke="#2F5DA8" stroke-width="2.5"/>
<text x="215.0" y="661" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">LanceDB 0.40.0</text>
<text x="215.0" y="690" text-anchor="middle" font-size="15" fill="#1F2430">question vs every passage</text>
<text x="215.0" y="711" text-anchor="middle" font-size="15" fill="#1F2430">3 closest passages</text>
<text x="215.0" y="732" text-anchor="middle" font-size="15" fill="#1F2430">(temp table, deleted after)</text>
<rect x="450" y="620" width="310" height="130" rx="12" fill="#E3ECFA" stroke="#2F5DA8" stroke-width="2.5"/>
<text x="605.0" y="661" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">Ollama</text>
<text x="605.0" y="690" text-anchor="middle" font-size="15" fill="#1F2430">smollm2:360m-instruct-q8_0</text>
<text x="605.0" y="711" text-anchor="middle" font-size="15" fill="#1F2430">reads only those 3 passages</text>
<text x="605.0" y="732" text-anchor="middle" font-size="14" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#1F2430">{answer, source_id}</text>
<rect x="840" y="620" width="310" height="130" rx="12" fill="#E3ECFA" stroke="#2F5DA8" stroke-width="2.5"/>
<text x="995.0" y="661" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">4 checks</text>
<text x="995.0" y="690" text-anchor="middle" font-size="15" fill="#1F2430">schema · citation</text>
<text x="995.0" y="711" text-anchor="middle" font-size="15" fill="#1F2430">grounding · canary</text>
<text x="995.0" y="732" text-anchor="middle" font-size="15" fill="#1F2430">(the cited passage holds the fact)</text>
<rect x="1230" y="620" width="310" height="130" rx="12" fill="#1F2430" stroke="#1F2430" stroke-width="2"/>
<text x="1385.0" y="661" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">CAPSTONE_OK</text>
