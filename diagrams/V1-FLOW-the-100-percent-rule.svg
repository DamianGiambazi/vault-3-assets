<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<title>Vault 1 · The 100% Rule: data flow: Documents in, one cited answer out. Each step is checked before the next one may run.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6472"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B42A2A"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B4532A"/></marker></defs>
<rect width="1600" height="900" fill="#FAF8F4"/>
<text x="60" y="62" font-size="32" font-weight="700" fill="#1F2430">Vault 1 · The 100% Rule: data flow</text>
<text x="60" y="94" font-size="19" fill="#5B6472">Documents in, one cited answer out. Each step is checked before the next one may run.</text>
<text x="1540" y="58" text-anchor="end" font-size="19" font-style="italic" fill="#1F2430">Write the answer down</text>
<text x="1540" y="84" text-anchor="end" font-size="19" font-style="italic" fill="#1F2430">before you run it.</text>
<rect x="60" y="150" width="310" height="130" rx="12" fill="#FFFFFF" stroke="#8A94A6" stroke-width="2"/>
<text x="215.0" y="191" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">input\</text>
<text x="215.0" y="220" text-anchor="middle" font-size="15" fill="#5B6472">your .txt documents</text>
<text x="215.0" y="241" text-anchor="middle" font-size="15" fill="#5B6472">+ question.txt (one sentence,</text>
<text x="215.0" y="262" text-anchor="middle" font-size="15" fill="#5B6472">worded unlike the text)</text>
<rect x="450" y="150" width="310" height="130" rx="12" fill="#E3ECFA" stroke="#2F5DA8" stroke-width="2.5"/>
<text x="605.0" y="191" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">vector-snake 2.0</text>
<text x="605.0" y="220" text-anchor="middle" font-size="15" fill="#1F2430">cuts each file into passages</text>
<text x="605.0" y="241" text-anchor="middle" font-size="15" fill="#1F2430">turns each into 384 numbers</text>
<text x="605.0" y="262" text-anchor="middle" font-size="15" fill="#1F2430">question in the SAME run</text>
<rect x="840" y="150" width="310" height="130" rx="12" fill="#FFFFFF" stroke="#8A94A6" stroke-width="2"/>
<text x="995.0" y="191" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">vectors\</text>
<text x="995.0" y="220" text-anchor="middle" font-size="15" fill="#5B6472">*_vectors.csv: text + numbers</text>
<text x="995.0" y="241" text-anchor="middle" font-size="15" fill="#5B6472">*_manifest.json: one per file</text>
<text x="995.0" y="262" text-anchor="middle" font-size="15" fill="#5B6472">*_run_manifest.json: the run</text>
<rect x="1230" y="150" width="310" height="130" rx="12" fill="#FFFFFF" stroke="#8A94A6" stroke-width="2"/>
<text x="1385.0" y="191" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">Hugging Face cache</text>
<text x="1385.0" y="220" text-anchor="middle" font-size="15" fill="#5B6472">all-MiniLM-L6-v2</text>
<text x="1385.0" y="241" text-anchor="middle" font-size="15" fill="#5B6472">the translator, used offline</text>
<text x="1385.0" y="262" text-anchor="middle" font-size="15" fill="#5B6472">hf CLI 2.2.0 shows what&#x27;s there</text>
<path d="M370 215 L442 215" fill="none" stroke="#5B6472" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M760 215 L832 215" fill="none" stroke="#5B6472" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M1385.0 280 L1385.0 320 L665.0 320 L665.0 288" fill="none" stroke="#5B6472" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/>
<text x="1365.0" y="342" text-anchor="end" font-size="15" fill="#5B6472">the model, read from disk (--offline)</text>
<rect x="840" y="400" width="310" height="130" rx="12" fill="#E3ECFA" stroke="#2F5DA8" stroke-width="2.5"/>
<text x="995.0" y="441" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">DuckDB · audit.sql</text>
<text x="995.0" y="470" text-anchor="middle" font-size="15" fill="#1F2430">the gate: 1 run · 0 failed</text>
<text x="995.0" y="491" text-anchor="middle" font-size="15" fill="#1F2430">1 model · 1 size · 1 question</text>
<text x="995.0" y="512" text-anchor="middle" font-size="14" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#1F2430">AUDIT_PASS  EXPORT_OK</text>
<rect x="450" y="400" width="310" height="130" rx="12" fill="#FFFFFF" stroke="#8A94A6" stroke-width="2"/>
<text x="605.0" y="441" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">corpus.parquet</text>
<text x="605.0" y="470" text-anchor="middle" font-size="15" fill="#5B6472">+ question.parquet</text>
<text x="605.0" y="491" text-anchor="middle" font-size="15" fill="#5B6472">clean evidence, typed vectors</text>
<text x="605.0" y="512" text-anchor="middle" font-size="15" fill="#5B6472">written only if the gate passed</text>
<rect x="1230" y="400" width="310" height="130" rx="12" fill="#FCEDED" stroke="#B42A2A" stroke-width="2"/>
<text x="1385.0" y="441" text-anchor="middle" font-size="21" font-weight="700" fill="#8E1F1F">AUDIT_FAIL</text>
<text x="1385.0" y="470" text-anchor="middle" font-size="15" fill="#8E1F1F">e.g. runs=2 or question_rows=2</text>
<text x="1385.0" y="491" text-anchor="middle" font-size="15" fill="#8E1F1F">nothing is exported:</text>
<text x="1385.0" y="512" text-anchor="middle" font-size="15" fill="#8E1F1F">the next step can&#x27;t run</text>
<rect x="60" y="400" width="310" height="130" rx="12" fill="#FFF4EE" stroke="#B4532A" stroke-width="2.5"/>
<text x="215.0" y="441" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2430">The 100% Rule</text>
<text x="215.0" y="470" text-anchor="middle" font-size="15" fill="#5B6472">“Are you 100% ready to execute</text>
<text x="215.0" y="491" text-anchor="middle" font-size="15" fill="#5B6472">the prompt, or do you need</text>
<text x="215.0" y="512" text-anchor="middle" font-size="15" fill="#5B6472">more information?”</text>
<path d="M995.0 280 L995.0 392" fill="none" stroke="#5B6472" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M840 465 L768 465" fill="none" stroke="#5B6472" stroke-width="2.5" marker-end="url(#a)"/>
