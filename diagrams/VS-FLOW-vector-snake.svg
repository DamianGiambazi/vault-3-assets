<rect x="60" y="853" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#8A94A6" stroke-width="1.5"/>
<text x="90" y="866" text-anchor="start" font-size="14" fill="#5B6472">files and evidence</text>
<rect x="236.79999999999998" y="853" width="22" height="16" rx="4" fill="#E3ECFA" stroke="#2F5DA8" stroke-width="1.5"/>
<text x="266.79999999999995" y="866" text-anchor="start" font-size="14" fill="#5B6472">a tool runs</text>
<rect x="360.4" y="853" width="22" height="16" rx="4" fill="#FFF4EE" stroke="#B4532A" stroke-width="1.5"/>
<text x="390.4" y="866" text-anchor="start" font-size="14" fill="#5B6472">you decide or write first</text>
<rect x="590.4" y="853" width="22" height="16" rx="4" fill="#1F2430" stroke="#1F2430" stroke-width="1.5"/>
<text x="620.4" y="866" text-anchor="start" font-size="14" fill="#5B6472">a verdict word</text>
<rect x="736.8" y="853" width="22" height="16" rx="4" fill="#FCEDED" stroke="#B42A2A" stroke-width="1.5"/>
<text x="766.8" y="866" text-anchor="start" font-size="14" fill="#5B6472">fails closed</text>
</svg>